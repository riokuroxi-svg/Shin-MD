a</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.7;1" dur="14s" begin="8.68s" repeatCount="indefinite"/><text x="292" y="320" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#F0B429">14</text><text x="292" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8FA3B4">recuperado solo</text></g><text x="292" y="374" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#54697B">riesgo calculado sobre la última hora</text><text x="640" y="46" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#7D90A0">MONITOR DE RIESGO 0-100</text><rect x="640" y="59" width="4" height="44" rx="2" fill="#4ADE80"/><text x="658" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#4ADE80">0 – 30</text><text x="658" y="94" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#CBD8E3">normal: la cola envía con su jitter gaussiano.</text><rect x="640" y="115" width="4" height="44" rx="2" fill="#F0B429"/><text x="658" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#F0B429">30 – 80</text><text x="658" y="150" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#CBD8E3">ojo: el monitor vigila más seguido.</text><rect x="640" y="171" width="4" height="44" rx="2" fill="#E05468"/><text x="658" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#E05468">≥ 80</text><text x="658" y="206" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#CBD8E3">el watchdog PAUSA los envíos, no apaga el bot.</text><rect x="640" y="227" width="4" height="44" rx="2" fill="#FF6B81"/><text x="658" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="700" fill="#FF6B81">≥ 95</text><text x="658" y="262" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#CBD8E3">reconexión forzada; 3 sin alivio → aviso claro.</text><rect x="624" y="282" width="406" height="74" rx="14" fill="rgba(74,222,128,0.05)" stroke="rgba(74,222,128,0.22)"/><text x="640" y="304" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8CF0B4">Cola de envíos</text><text x="640" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#A7C4B4">0 en espera · prioridad activa · tope de 120 s por envío</text><rect x="640" y="336" width="374" height="6" rx="3" fill="rgba(255,255,255,0.07)"/><rect x="640" y="336" width="374" height="6" rx="3" fill="#4ADE80"><animate attributeName="width" values="374;374;0;0;374" keyTimes="0;0.4;0.6;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
