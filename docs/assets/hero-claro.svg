    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.10"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
